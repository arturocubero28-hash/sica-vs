# Configuración de Nginx para producción (droplet DigitalOcean)
# En local NO se usa: Vite y Flask se exponen directo por sus puertos.
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;  # límite de subida (comprobantes, fotos)

    # Frontend (archivos estáticos compilados)
    location / {
        root /var/www/sica-vs;
        try_files $uri $uri/ /index.html;
    }

    # API hacia el backend Flask/Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket para el panel en vivo (Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Archivos subidos: servir pero NUNCA ejecutar scripts
    location /uploads/ {
        root /app;
        location ~* \.(php|py|sh|cgi)$ { deny all; }
    }
}
