# =====================================================================
# SICA-VS — configuración de Nginx para producción
#
# CSP-19 (Auditoría Día 39). Este archivo es donde vive el CSP que
# realmente protege: Nginx sirve el HTML de la aplicación, y un CSP solo
# tiene efecto sobre HTML. El de Flask (app/__init__.py) va en respuestas
# JSON, donde el navegador no tiene nada que aplicar.
#
# ESTADO: Día 58 — VPS de Hostinger contratado, dominio real configurado
# (patronatovillasdelsol.com). Ver deploy/GUIA_DEPLOY.md para el
# procedimiento completo de despliegue. Ver docs/CSP_Y_CABECERAS.md §5
# para el detalle de las cabeceras.
#
# Instalación (cuando exista el servidor):
#   sudo cp deploy/nginx-sicavs.conf /etc/nginx/sites-available/sicavs
#   sudo ln -s /etc/nginx/sites-available/sicavs /etc/nginx/sites-enabled/
#   sudo nginx -t          # valida sintaxis ANTES de recargar
#   sudo systemctl reload nginx
# =====================================================================

# Redirigir todo el tráfico sin cifrar a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name patronatovillasdelsol.com;

    # Certbot necesita servir su desafío por HTTP para renovar el
    # certificado. Es la única excepción a la redirección.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name patronatovillasdelsol.com;

    # ── TLS ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/patronatovillasdelsol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patronatovillasdelsol.com/privkey.pem;

    # Solo TLS 1.2 y 1.3. Las versiones anteriores tienen debilidades
    # conocidas y ningún navegador vigente las necesita.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # en TLS 1.3 el cliente elige mejor
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: el servidor adjunta la prueba de que su certificado
    # no fue revocado, así el navegador no tiene que consultarlo aparte.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    root /var/www/sicavs;
    index index.html;

    # ── Cabeceras de seguridad ───────────────────────────────────────
    #
    # 'always' hace que se envíen también en respuestas de error (4xx, 5xx).
    # Sin eso, una página de error queda sin protección.

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # HSTS: obliga al navegador a usar HTTPS en visitas futuras.
    # OJO: 'preload' es prácticamente irreversible — pedir la salida de la
    # lista de precarga de navegadores toma meses. No activarlo hasta estar
    # seguro de que el dominio y todos sus subdominios van a servir HTTPS
    # para siempre.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Content-Security-Policy ──────────────────────────────────────
    #
    # CSP-19: este es el CSP que importa. Diferencias con el permisivo que
    # usa el servidor de desarrollo de Vite:
    #
    #   script-src SIN 'unsafe-eval'
    #     Vite lo necesita para el hot-reload, que evalúa código en
    #     caliente. Un build de producción de React ya está compilado y no
    #     evalúa nada — se puede quitar sin romper nada. Es la directiva
    #     más peligrosa de las dos: permite convertir una cadena de texto
    #     en código ejecutable.
    #
    #   script-src SIN 'unsafe-inline'
    #     Vite inyecta scripts en línea para el cliente de recarga. El
    #     build de producción emite archivos .js separados. Quitarlo cierra
    #     la vía más común de XSS: inyectar un <script> en la página.
    #
    #   style-src CON 'unsafe-inline'  ← única concesión
    #     React inyecta estilos en línea (atributo style=) y quitarlo
    #     requeriría nonces por cada render. El riesgo es mucho menor que
    #     en script-src: un estilo malicioso puede alterar la apariencia
    #     (superponer un botón falso), pero no ejecutar código.
    #     Endurecerlo queda como mejora futura.
    #
    #   connect-src 'self' https://*.digitaloceanspaces.com
    #     Sin ws:/wss:, porque Socket.IO se eliminó en SOCKET-17 (Día 41).
    #     Si algún día se reintroduce tiempo real, agregar aquí el origen
    #     concreto — nunca un comodín.
    #     digitaloceanspaces.com (Día 59, bug real): el logo se descarga
    #     con fetch() para incrustarlo en los PDFs de reportes (jsPDF
    #     necesita los bytes, no solo mostrar una <img>) -- el backend
    #     REDIRIGE (302) a una URL firmada de Spaces, así que el navegador
    #     termina las conexión directo a Spaces. Para peticiones iniciadas
    #     por fetch/XHR, la directiva que manda es connect-src, NO
    #     img-src (que solo rige <img>/CSS) -- agregar el dominio acá
    #     también, no solo en img-src, es lo que faltaba.
    #
    #   img-src ... data: blob: https://*.digitaloceanspaces.com
    #     data: lo necesita el QR de la tarjeta virtual, que se genera en
    #     el cliente. blob: lo necesita la vista previa de fotos antes de
    #     subirlas. digitaloceanspaces.com (Día 59, bug real): el logo de
    #     la residencial (y cualquier otra imagen servida vía redirect a
    #     una URL firmada de Spaces -- ver storage.py servir_archivo())
    #     se carga con el navegador pidiéndola DIRECTO a Spaces, no al
    #     propio dominio -- sin este origen el CSP la bloqueaba en
    #     silencio (el backend respondía bien, pero el navegador tiraba
    #     la imagen igual). El comodín cubre cualquier región
    #     (nyc3, sfo3, etc.) sin tener que tocar esto si cambia
    #     SPACES_REGION en el futuro.
    #
    #   object-src 'none'
    #     Bloquea <object>, <embed> y <applet>. Vectores antiguos de
    #     ejecución de código que ninguna parte de este sistema usa.
    #
    #   upgrade-insecure-requests
    #     Si algún recurso quedara referenciado por http://, el navegador
    #     lo pide por https:// en vez de bloquearlo o mostrar advertencia.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.digitaloceanspaces.com; font-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ── Frontend (SPA de React) ──────────────────────────────────────
    location / {
        # try_files con /index.html al final: el enrutado lo maneja React,
        # así que cualquier ruta desconocida debe devolver la aplicación,
        # no un 404 de Nginx.
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (app.4f3a2b.js) son inmutables:
    # si cambia el contenido, cambia el nombre. Se pueden cachear un año.
    #
    # BUG REAL (Día 58, mismo hallazgo que en /api/ más abajo): este
    # location ya tenía su propio add_header (Cache-Control), y por la
    # regla de herencia de nginx eso descartaba TODAS las cabeceras de
    # seguridad del nivel server para estos archivos -- el CSP nunca se
    # estaba aplicando a los JS/CSS reales. Se repiten acá a mano.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.digitaloceanspaces.com; font-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        access_log off;
    }

    # index.html NUNCA se cachea: es quien apunta a los assets con hash.
    # Si queda cacheado, el navegador seguiría pidiendo la versión vieja
    # después de un despliegue.
    #
    # Mismo bug de herencia que arriba: repetido a mano por la misma razón.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.digitaloceanspaces.com; font-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    # ── API (Flask vía gunicorn) ─────────────────────────────────────
    location ^~ /api/ {
        # Día 59 — BUG REAL encontrado: sin el "^~", esta ubicación (un
        # simple prefijo) PERDÍA contra la regla de assets estáticos de
        # arriba (location ~* \.(...|jpeg|...)$) para cualquier URL de la
        # API que terminara en una de esas extensiones -- por ejemplo, el
        # logo de una residencial se sirve en una ruta como
        # /api/v1/unidades/mi-residencial/logo/xxxx.jpeg. En nginx, una
        # location con expresión regular (~*) le gana a una de prefijo
        # simple (/api/) SIN IMPORTAR cuál sea más específica, salvo que el
        # prefijo lleve "^~" (que le dice a nginx "si este prefijo
        # calza, no sigas buscando una regex mejor, usá este location
        # directo"). Sin esto, esa petición nunca llegaba al backend:
        # nginx buscaba el archivo en el disco del frontend estático
        # (/var/www/sicavs/api/v1/.../xxxx.jpeg), no lo encontraba, y
        # devolvía su propio 404 en HTML -- confirmado con curl: pasando
        # por nginx daba 404, pegándole directo al backend (127.0.0.1:5000)
        # daba 401 (la ruta se reconocía bien, solo faltaba el token real).
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Subida de fotos de acceso: hasta 5 comprobantes por pago.
        client_max_body_size 25M;

        # Generación de reportes PDF puede tardar en meses con mucho
        # movimiento.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # BUG REAL encontrado en el primer deploy (Día 58): un add_header a
        # nivel server (más arriba en este archivo) se hereda a TODOS los
        # locations, salvo que el location tenga sus propios add_header —
        # en cuyo caso nginx descarta TODOS los del nivel server para ese
        # location, no solo el que se repite. El backend YA manda su propio
        # Content-Security-Policy en las respuestas de /api/ (ver
        # app/__init__.py, CSP-19: "default-src 'none'" — correcto para
        # JSON, no HTML). Si Nginx agregaba el suyo encima, el cliente
        # recibía DOS headers Content-Security-Policy en la misma
        # respuesta, lo cual HTTP/2 rechaza de forma estricta ("Invalid
        # HTTP header field") -- eso rompía el login.
        #
        # Por eso acá se repiten a mano las cabeceras "buenas" (para no
        # perderlas por la regla de herencia de nginx) EXCEPTO
        # Content-Security-Policy, que se deja exclusivamente al backend en
        # esta ruta.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Fotos de evidencia ───────────────────────────────────────────
    #
    # PENDIENTE (Auditoría Día 39): las fotos de identidad y placa de los
    # visitantes NO deben servirse como carpeta estática pública. Aunque
    # los nombres son UUID impredecibles, "difícil de adivinar" no es
    # control de acceso: cualquiera con el enlace ve la cédula de un
    # visitante, y los residentes podrían ver evidencia de otras cuentas.
    #
    # Lo correcto es un endpoint autenticado que verifique permisos antes
    # de entregar el archivo, o URLs firmadas de corta vida desde
    # DigitalOcean Spaces (ya está el módulo storage.py que lo soporta).
    #
    # Hasta implementarlo, se bloquea por completo. Es preferible que la
    # función no ande a que filtre documentos de identidad.
    location /uploads/ {
        deny all;
        return 404;
    }

    # Ocultar la versión de Nginx en cabeceras y páginas de error.
    server_tokens off;

    # No servir archivos ocultos (.git, .env, .htaccess).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
