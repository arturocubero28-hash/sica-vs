# =====================================================================
# SICA-VS — Nginx PROVISIONAL, solo HTTP (sin SSL)
#
# Problema de "huevo y gallina" del primer arranque: nginx-sicavs.conf
# (el definitivo) exige un certificado SSL que Certbot todavía no generó
# -- y Certbot necesita que Nginx esté sirviendo HTTP en el dominio para
# poder validar que el dominio es tuyo y emitir el certificado.
#
# Este archivo rompe ese ciclo: sirve el sitio por HTTP nada más y deja
# pasar la verificación de Certbot. Se usa SOLO para el primer arranque;
# después de obtener el certificado, se reemplaza por nginx-sicavs.conf
# (el definitivo, con HTTPS/CSP/cabeceras de seguridad) -- ver el paso a
# paso en deploy/GUIA_DEPLOY.md.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name patronatovillasdelsol.com www.patronatovillasdelsol.com;

    # Certbot valida el dominio pidiendo un archivo por esta ruta.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/sicavs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Día 59 — mismo criterio que en nginx-sicavs.conf: ^~ asegura que
    # cualquier ruta de la API tenga prioridad sobre reglas con regex que
    # puedan agregarse más adelante (ej. cache de assets por extensión).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
